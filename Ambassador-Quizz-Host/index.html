<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambassador Quizz — Host</title>
<meta name="theme-color" content="#46178F">
<meta name="description" content="Կենսաբազմազանության վիկտորինայի հանդիսավարի էկրան։">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../Media/logo_white.png">
<link rel="stylesheet" href="../styles.css?v=3c32ddbbcf">
</head>
<body class="qz qz-host" data-page="ambassador-quizz-host">

<div class="qz-shapes" aria-hidden="true">
  <span class="qz-shape qz-shape--tri"></span>
  <span class="qz-shape qz-shape--dia"></span>
  <span class="qz-shape qz-shape--cir"></span>
  <span class="qz-shape qz-shape--sqr"></span>
</div>

<main id="main" class="qz-main">

  <!-- ══ Login ══ -->
  <section id="qhLogin" class="qz-panel">
    <p class="qz-brand">Ambassador <span>Quizz</span></p>
    <p class="qz-tag">Հանդիսավարի էկրան <span class="qz-en">(Host Screen)</span></p>
    <div class="qz-card">
      <label class="qz-label" for="qhPassword">Գաղտնաբառ <span class="qz-en">(Password)</span></label>
      <input type="password" id="qhPassword" class="qz-input" autocomplete="current-password">
      <p class="qz-err" id="qhLoginErr" hidden>Սխալ գաղտնաբառ։ <span class="qz-en">(Wrong password.)</span></p>
      <button type="button" class="qz-btn qz-btn--primary" id="qhLoginBtn">Մուտք <span class="qz-en">(Log in)</span></button>
    </div>
  </section>

  <!-- ══ Lobby ══ -->
  <section id="qhLobby" class="qz-panel" hidden>
    <p class="qz-brand">Ambassador <span>Quizz</span></p>
    <p class="qz-tag" id="qhLobbyCount">0 խաղացող միացել է <span class="qz-en">(players joined)</span></p>
    <div class="qz-hostnames" id="qhPlayerNames"></div>
    <button type="button" class="qz-btn qz-btn--primary qz-btn--lg" id="qhStartBtn">
      Սկսել խաղը <span class="qz-en">(Start Game)</span>
    </button>
  </section>

  <!-- ══ Question (host projector view) ══ -->
  <section id="qhQuestion" class="qz-panel qz-panel--q" hidden>
    <div class="qz-qbar">
      <span class="qz-qnum" id="qhQNum"></span>
      <div class="qz-timer"><span id="qhTimerNum">40</span></div>
      <span class="qz-score" id="qhAnsweredCount"></span>
    </div>
    <h2 class="qz-qtext qz-qtext--host" id="qhQTextHy"></h2>
    <p class="qz-qtext-en" id="qhQTextEn"></p>
    <div class="qz-options qz-options--host" id="qhOptions"></div>
  </section>

  <!-- ══ Reveal (host) ══ -->
  <section id="qhReveal" class="qz-panel qz-panel--q" hidden>
    <div class="qz-qbar">
      <span class="qz-qnum" id="qhRevealQNum"></span>
      <span class="qz-score" id="qhRevealAnsweredCount"></span>
    </div>
    <h2 class="qz-qtext qz-qtext--host" id="qhRevealQTextHy"></h2>
    <div class="qz-options qz-options--host qz-options--reveal" id="qhRevealOptions"></div>
    <button type="button" class="qz-btn qz-btn--primary qz-btn--lg" id="qhNextBtn">
      Հաջորդ հարց <span class="qz-en">(Next Question)</span> &rarr;
    </button>
  </section>

  <!-- ══ Podium (host) ══ -->
  <section id="qhPodium" class="qz-panel" hidden>
    <p class="qz-brand qz-brand--sm">Խաղն ավարտված է! <span class="qz-en">(Game Over!)</span></p>
    <div class="qz-podium" id="qhPodiumBlocks"></div>
    <button type="button" class="qz-btn qz-btn--ghost-dark" id="qhResetBtn">
      <span id="qhResetLbl">Զրոյացնել խաղը <span class="qz-en">(Reset Game)</span></span>
    </button>
  </section>

  <p class="qz-offline" id="qhOffline" hidden>Կապը տվյալների բազայի հետ ընդհատված է. թարմացրու էջը։</p>
</main>

<script src="../vendor/supabase.js"></script>
<script src="../supabase-config.js?v=93687eb35b"></script>
<script src="../supabase-client.js?v=7fecebbfe4"></script>
<script src="../quiz-host.js?v=1ce6f38569"></script>
</body>
</html>
