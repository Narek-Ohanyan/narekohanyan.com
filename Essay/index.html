        const GEMINI_API_URL = "/api/gemini";
        async function callGeminiAPI(prompt, schema = null, systemInstruction = null) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            
            if (schema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: schema
                };
            }
            
            if (systemInstruction) {
                payload.systemInstruction = {
                    parts: [{ text: systemInstruction }]
                };
            }
            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                }
                throw new Error("Invalid response structure from Gemini API");
            } catch (error) {
                console.error("Gemini API Error:", error);
                return null;
            }
        }

        question: 'Ինչպե՞ս և ի՞նչ ազդեցություն ունեցավ Գևորգ Դ. Կոստանդնուպոլսեցի կաթողիկոսը հայ հասարակության կրթության զարգացման գործում: Ինչպիսի՞ միջավայրում հայտնվեց Կամսարյանը, ինչպե՞ս էր նա ցանկանում փոխել այդ միջավայրը: Ի՞նչ նմանություններ և տարբերություններ ես տեսնում Կամսարյանի և Գևորգ Դ. Կոստանդնուպոլսեցի կաթողիկոսի գործունեությունների միջև։',

        histText: `Գևորգ Դ․ Կոստանդնուպոլսեցի կաթողիկոսը իր կյանքի ողջ գործունեության ընթացքը նվիրել է կրթության զարգացմանը և դպրոցաշինությանը: Նրա ջանքերով բարեկարգվեցին Պրուսայի երկսեռ դպրոցները, ավելացավ դպրոց հաճախող աշակերտների թվաքանակը, բարձրացավ հայկական դպրոցների հեղինակությունը։ Այստեղ սկսեցին հաճախել նաև հարևանությամբ բնակվող հույների երեխաները։ 1848 թ. նա Էջմիածնում կաթողիկոս Ներսես Ե. Աշտարակեցու կողմից ձեռնադրվեց եպիսկոպոս, 1851 թ. ստացավ Քյոթահիայի (Կուտինա) վիճակի առաջնորդությունը։ 1855 թ. տեղի ունեցավ Պրուսայի ավերիչ երկրաշարժը, որից բազում հայկական ընտանիքներ տուժեցին։
Օգտագործելով իր հեղինակությունը՝ Գևորգ եպիսկոպոսը կարողացավ ոչ միայն միջոցներ հավաքել և օգնել երկրաշարժից տուժած ընտանիքներին, այլև ավերված դպրոցի համար շենք վարձեց և վերակառուցեց Պուրսայի եկեղեցու փլուզված կամարները։
1866 թ. Մայր Աթոռում հրավիրված ազգային-եկեղեցական ժողովը Գևորգ արքեպիսկոպոսին միաձայն ընտրեց Ամենայն Հայոց կաթողիկոս։ Իր հայրապետության ժամանակաշրջանում նա ջանաց պահպանել Հայոց եկեղեցու միասնականությունը, նպաստել հայ ժողովրդի մտավոր զարգացմանը, դպրոցաշինության ու գրատպության բարելավմանը։ Գևորգ Դ. կաթողիկոսը մեծ ջանք ներդրեց ոչ միայն հայկական դպրոցների բացման, այլև այդ դպրոցների նյութական և մտավոր գործունեությունը կանոնավորելու ուղղութամբ։ Այդ նպատակով 1867 թ. նա ստեղծեց ուսումնական հանձնաժողով՝ հայկական եկեղեցական դպրոցների համար մեկ ընդհանուր կանոնադրություն մշակելու նպատակով։
Միասնական, միանման կրթական համակարգ ապահովելու համար նշանակվեցին թեմական տեսուչներ, որոնք գործող դպրոցներում նպաստելու էին կանոնադրության կիրառմանը, իսկ այն վայրերում, որտեղ դպրոցներ չկային, երկսեռ դպրոցների բացման ուղղությամբ աշխատանքներ պետք է իրականացվեին։
1874 թ. Էջմիածնին կից Գևորգ Դ. կաթողիկոսը հիմք դրեց մի դպրոցի, որն իր անվամբ կոչվեց Գևորգյան ճեմարան։ Այն Հայաստանում մինչև օրս գործող ամենահին բարձրագույն ուսումնական հաստատությունն է։ Գևորգ կաթողիկոսը մահացել է 1882 թ. դեկտեմբերի 6-ին։ Նա արժանացել է «Մեծագործ» պատվատիտղոսին։`

        histText: `XII-րդ դարում Հայաստանը և շրջակա տարածքները սելջուկ-թուրքերի կողմից ենթարկվեցին հարձակումների: Հայ ժողովուրդը համառ կերպով պայքար էր մղում նրանց դեմ: Սելջուկ թուրքերի հերթական հարձակման ժամանակ պաշարման մեջ հայտնվեց Անի քաղաքը: Անիի պաշտպանության գործում 1124 թ. աչքի ընկավ՝ Այծեմնիկ անունով մի կին: Նա Անիի պարիսպների վրա քաջաբար պայքարում էր Փատլուն ամիրայի զորքերի դեմ։ Ըստ Սամվել Անեցի պատմիչի՝ Անիի պաշարումը տևել է մեկ տարի՝ բերելով մեծ ավեր և սով քաղաքում ու ողջ Շիրակում։ Այծեմնիկը, կանգնած պարիսպների վրա, հերոսաբար մասնակցում էր այդ կռիվներին։ Նա, անտեսելով իր վերքերը, թշնամու արձակած նետերը դուրս էր քաշում մարմնից և հետ ուղարկում։

Ճաշից հետո լուր տարածվեց, որ բոլոր որբերին տանելու են բաղնիք, հին շորերը ոչնչացնելու և նոր շորեր տալու։ Այդպես էլ եղավ։ Այստեղ ես շատ վնասվեցի, որովհետև ես կորցրի իմ նոր և վայելուչ շորերը և բոլորի նման հագա ծաղկավոր չթից կարած մի շապիկ, մի վարտիք, իսկ գլխիս կապեցի մի ծաղկավոր թաշկինակ: Ուրիշ ոչինչ։ Այլ պայմաններում ես կամաչեի այդ դրությամբ՝ մի տակ շապիկ-վարտիքով և բոբիկ ոտներով ման գալ, բայց ստեղծված կացությունը թույլ չէր տալիս զբաղվել նման կենցաղային մանրուքներով։Ինձ մոտեցավ ինձնից մեծ, հանդուգն աչքերով մի տղա և մի կողմ տարավ։ Զգուշությամբ, շուրջը նայելով, նա շապիկի տակից հանեց մի ծաղկավոր թաշկինակ և ցույց տվեց.

        histText: `Գաղթականության վիճակը Հայաստանի առաջին հանրապետության տարիներին

        artText: `Րաֆֆի «Խենթը» (Հատված վեպից)
Առավոտ էր: Տներից խումբերով դուրս էին գալիս գյուղական մանուկները, առողջ, զվարթ և մաքուր հագնված: Տղա և աղջիկ, խառն միմյանց հետ, գրքերը ուսներին շալակած, շտապով դիմում էին դպրոցը: Վարդանը նայում էր իրանց վրա և հիանում էր: Որքա՜ն լավ պահված էին այդ սիրուն երեխաները, որքա՛ն ուրախ էին նրանք: Երևի դպրոցը և վարժապետը չեն վախեցնում նրանց: Մի՞թե դրանք այն կիսամերկ և հիվանդոտ երեխաներն էին, որոնց տեսել էր Վարդանը: 
Այդ մեր գյուղատնտեսական դպրոցն է,– ասաց Վարդանի հյուրընկալը: Այն, որ տեսաք առավոտյան, տարրական ուսումնարան էր: Այս ի՞նչ դպրոց էր, այսպիսի դպրոց Վարդանը երբեք չէր տեսել, թեև ինքն էլ մի ժամանակ վարժապետ էր եղել:

        histText: `Զանգվածային անգրագիտության վերացումը և հանրակրթական դպրոցը Խորհրդային Հայաստանում: Հնագույն մշակույթի տեր հայ ժողվուրդը, այնուամենայնիվ, հին կարգերից ստացել էր քիչ ժառանգություն հատկապես գրագիտության բնագավառում։ Մասնավորապես՝ համատարած անգրագիտություն էր տիրում գյուղում։

Անձնատուր չենք լինի, քանի դեռ կենդանի ենք,— կրկնեց նա իր առաջին խոսքը։  Եթե դրսից մեզ օգնություն չհասնե, կորած ենք,— պատասխանեց մի խան, որ թուրք կամավորների գլխավորն էր։
Օգնություն սպասելու զորություն չէ մնացել,— խոսեց մի բեկ,— իմ կարծիքով պետք է բաց անել բերդի դռները, պատառել մեզ շրջապատող թշնամու շղթան և անցկենալ, կա՛մ կհաջողվի ազատվել, կա՛մ կընկնենք թշնամու ձեռքը։
.....Նախագահը ասաց.
Պետք է սպասել և մինչև վերջին շունչը դիմադրել։ Ես հուսով եմ, որ շուտով օգնություն կստանանք։ Գեներալ ՏերՂուկասովը շատ հեռու չէ մեզանից։ Նա հենց որ իմացավ մեր դրությունը, կշտապե Բայազեդը ազատելու։ Միայն պետք է շուտով նրան իմացում տալ։.
Կարծեմ, մեր այսքան բազմության մեջ կգտնվի մի սիրտ ունեցող տղամարդ։
..Խորհուրդը վճռեց նամակ գրել ՏերՂուկասովին, և քառորդ ժամից հետո բերդապահը, պատրաստ նամակը ձեռին, մյուսների հետ դուրս եկավ խորհրդարանից։
Թմբուկի թեթև ձայնը հավաքեց զինվորներին բերդի հրապարակի վրա։ Բերդապահը բարձր ձայնով խոսեց.
Տղե՛րք, ձեզ հայտնի է մեր դրությունը, այդ մասին խոսալը ավելորդ է։ Այժմ մեր հույսը մնացել է աստուծո վրա և նրա հաջողությամբ դրսից գալու օգնության վրա։ Եթե օգնությունը ուշացավ, մենք կորած ենք։ Ուրեմն պետք է շտապենք մեր վիճակի մասին շուտով իմացում տալ, ուր որ հարկն է։ Ահա այդ նամակը պետք է հասցնել գեներալ Տեր-Ղուկասովին, որը մեզանից շատ հեռու չէ գտնվում։ Նա այդ նամակը ստացածին պես, կշտապե մեզ ազատելու։ Հիմա ո՞վ կլինի ձեզանից այն քաջը, որ հանձն կառնե կատարել այդ մեծ ծառայությունը, թող մոտենա և ընդունե նամակը։ Ես խոստանում եմ, որ նա կստանա մի այնպիսի պարգև, որը վայել է մի անձնազոհ տղամարդի, որ այսքան բազմության ազատության պատճառ է լինելու։ Թո՛ղ ձայն տա, ով որ ցանկանում է տանել նամակը։
Տիրեց ընդհանուր լռություն և բազմության միջից ոչ մի ձայն լսելի չեղավ։.....
Մի՛թե ձեր մեջ չկա՞ սիրտ ունեցող մի տղամարդ,— կոչեց նա դողդոջուն ձայնով.— ո՞վ է հանձն առնում տանել նամակը։
Ես,— լսելի եղավ բազմության միջից մի ձայն և մի հայ երիտասարդ մոտեցավ, ընդունեց նամակը։

        histText: `1877 թ. ապրիլի 12-ին սկսված ռուս-թուրքական պատերազմը մղվում էր երկու ռազմաճակատով՝ Բալկանյան և Կովկասյան: Կովկասյան ճակատում հիմնական հարվածող ուժը հայազգի գեներալ Միխայիլ Լոռիս-Մելիքովի (Լոռու Մելիքյան) հրամանատարությամբ գործող 52-հազարանոց Կովկասյան կորպուսն էր, որի գլխավոր ուժերը կենտրոնացած էին Ալեքսանդրապոլ-Կարս ուղղությամբ: Ձախ թևում՝ Իգդիր-Բայազետ ուղղությամբ գործում էր գեներալ Արշակ Տեր-Ղուկասովի գլխավորած Երևանյան ջոկատը, իսկ աջ թևում՝ Ախալցխա-Արդահան ուղղությամբ, գեներալ Դևելի զորաջոկատը:
1877 թ. ապրիլի 15-ին Երևանյան ջոկատը Իգդիրից հարձակվեց Բայազետի վրա և ապրիլի 18-ին մտավ քաղաք: Բայազետում թողնելով փոքրաթիվ կայազոր Տեր Ղուկասովը շարժվեց դեպի Դիադին և ապրիլ-մայիս ամիսներին գրավեց Դիադինը, Ղարաքիլիսան, Ալաշկերտը, Զեյդեկանը: Ռուսներին մեծապես օգնում էին տեղացի հայերը: Հունիսին, ճակատի աջ թևում գործող ռուսական զորամասի պարտության պատճառով, Երևանյան ջոկատը, որպեսզի չհայտնվի շրջափակման մեջ, նահանջի հրաման է ստանում։ Ութ օր (հունիսի 16-24-ը) տևած նահանջը հայ գեներալը կատարում է հմտորեն: Իգդիր հասնելուն պես լուծում է պարենավորման ու սպառազինման խնդիրը, միաժամանակ անկորուստ ռուսական սահման է հասցնում իր զորամասը, նրա հետ միասին նաև շուրջ 600 հիվանդ և վիրավոր ու մոտ 2500 հայ գաղթական: Ռազմագետները Տեր-Ղուկասովի այս նահանջը համեմատում են Քսենոփոնի 10 հազար հույն զինվորների նշանավոր նահանջի (Ք.ա. 401 թ.) հետ, համարում սխրանք, օրինակելի նահանջ:
Օգտվելով Երևանյան ջոկատի նահանջից՝ թուրքերը մոտ 10-հազարանոց զորքով 1877 թ. հունիսին պաշարում են Բայազետի բերդը: Բայազետի փոքրաթիվ ռուսական կայազորը, հրամանատար Շտոկվիչի գլխավորությամբ և հայ կամավորների օժանդակությամբ, կազմակերպում են բերդի պաշտպանությունը: Դրությունը՝ օրհասական էր, սպառվում էր պարենն ու ռազմամթերքը: Փրկության միակ ելքը դրսից օգնություն ստանալն էր: Պաշարվածների ուղարկած բոլոր նամակատարները բռնվում էին թուրքերի կողմից: Վերջապես հայ կամավորներից Սամսոն Տեր-Պողոսյանին, քրդի շորերով ծպտված, հաջողվում է անցնել պաշարման շղթայով և լուր հասցնել Տեր-Ղուկասովին: Երևանյան ջոկատն օգնության է հասնում Բայազետում 23 օր պաշարվածներին և փրկում նրանց։

        question: 'Համադրելով պատմական փաստերն ու գեղարվեստական հատվածները՝ ներկայացրո՛ւ Տիգրան Երվանդյանին՝ որպես պետական և քաղաքական գործչի՝ համապատասխան հատվածներով հիմնավորելով պատասխանդ։',
        artText: `Մովսես Խորենացի «Տիգրան և Աժդահակ»
Աժդահակը Մարաստանի թագավորն էր և Տիգրանի դաշնակիցը։ Բայց Տիգրանը միաժամանակ դաշնակիցն էր Մարաստանի թշնամի պարսից Կյուրոս թագավորի։ Այս դաշնակցությունը շատ էր մտահոգում և անհանգստացնում Աժդահակին։ Նա ամեն անգամ հիշելով Կյուրոսի և Տիգրանի դաշնակցությունը, անհանգստանում էր, և մտածում, թե ի՞նչ հնարներ ու միջոցներ կարելի է գտնել՝ քանդել տալու սիրո կապը պարսիկի և բազմաբյուր զորք ունեցող հայ Տիգրանի միջև։
Այս տևական մտատանջություններից ու կասկածներից ալեկոծված, մի գիշեր Աժդահակը այնպիսի երազ է տեսնում.
Աժդահակը այդ երազից սարսափահար, քնից վեր է թռչում և կեսգիշերին, չսպասելով լուսանալուն, շտապ կանչում է իր խորհրդակիցներին.
Իմ սիրելիներ,— ասում է նա, երազումս ես մի անծանոթ երկրում էի, մի բարձրաբերձ լեռան մոտ, որի գագաթը թվում էր պատած սարսափելի սառնամանիքով։ Կարծես մեկը ասելիս լիներ, թե դա Հայկազանց երկիրն է։ Երբ ես երկար նայում էի այդ լեռանը, հանկարծ մի ծիրանազգեստ կին երևաց. Ծննդաբերության ցավերով էր բռնված։
Հանկարծ կինը ազատվեց և բերեց երեք զավակ, երեքն էլ հասակով ու տեսքով՝ կատարյալ դյուցազաններ։ Առաջինը առյուծի վրա նստած սլացավ դեպի արևմուտք, երկրորդը՝ ընձի վրա հեծած, դիմեց հյուսիս, իսկ երրորդը վիթխարի վիշապ սանձած՝ բուռն թափով հարձակվեց մեր տերության վրա։ Ուզում էր կործանել մեր աստվածներին։ Այդ պահին ես կռվի մեջ մտա և այդ սքանչելի դյուցազնի հարձակումն ինձ վրա ընդունեցի։ Նախ նիզակների տեգերով սկսեցինք միմյանց մարմինները խոցել Հետո երկար ժամանակ կռվեցինք այլ զենքերով։
Կռիվը վերջացավ իմ կործանումով։ Տագնապալի հուզմունքից սաստիկ քրտնել էի, քունս փախավ, և թվում էր, թե այլևս կենդանի չեմ։ Կարծում եմ, որ այս երազս ուրիշ բան չի նշանակում, քան այն, որ Հայկազյան Տիգրանի կողմից մեզ վրա անակնկալ հարձակում է սպասվում։ Ուստի խնդրում եմ ձեզ, աստվածների օգնությամբ, խոսքով ու գործով, բարի խորհրդով մեզ աջակից ու օգնական լինել։`,
        histText: `Երվանդական Հայաստանի կազմավորումը և Աքեմենյան Պարսկաստանը

        artText: `Ակսել Բակունց «Սպիտակ ձին»

        histText: `Հայերի մասնակցությունն Առաջին աշխարհամարտին։ Կովկասյան ճակատը և կամավորական շարժումը։ Հայկական ջոկատների կազմավորումը և գործունեությունը:
Առաջին համաշխարհային պատերազմի առաջին իսկ օրերից սկիզբ առավ կամավորական շարժումը։ Ռուսական կայսրությունում բնակվող շուրջ 2 միլիոն 54 հազար հայերից ռուսական բանակ են զորակոչվում մոտ 200 հազար հոգի։ Իսկ Անտանտի երկրների բանակներում ծառայող հայերի թիվը շուրջ 50 հազարի է հասնում։ Միաժամանակ հայ հասարակական-քաղաքական շրջանները ձեռնամուխ են լինում կամավորական ջոկատների ստեղծմանը։ Կամավորական ջոկատների կազմակերպումը նպատակ ուներ նպաստել ոչ թե ցարիզմի նվաճողական քաղաքականությանը, այլ օգտագործել նրա ռազմական ուժերը Արևմտյան Հայաստանն ազատագրելու համար։ Ռուսաստանի շահերը Մերձավոր Արևելքում և մասնավորապես Արևմտյան Հայաստանում համընկնում էին հայ ժողովրդի ազատագրական ձգտումներին։ Բացի հայերից՝ կամավորական ջոկատներ են կազմվում ասորիներից, հույներից, վրացիներից և կովկասյան այլ ժողովուրդներից։
Կամավորական ջոկատների կազմակերպման աշխատանքներն իր վրա է վերցնում Թիֆլիսում գործող Հայկական ազգային բյուրոն։ Նրա ճնշող մեծամասնությունը Դաշնակցություն կուսակցության անդամներն էին։ Հայ քաղաքական հիմնական ուժերը կամավորական շարժման գլխավոր նպատակ հռչակեցին հայկական ինքնավարության ստեղծումը՝ Ռուսաստանի հովանու ներքո։ Այդ նպատակի իրագործման համար որոշվեց ձևավորել հայկական զորաջոկատներ և ռուսական բանակի կողքին կռվել թուրքերի դեմ։ Արևմտյան Հայաստանը թուրքական լծից ազատագրելու կոչը լայն արձագանք գտավ ոչ միայն կայսրության հայաբնակ շրջաններում, այլև արտասահմանում։ Կամավորներ ժամանեցին շատ երկրներից, նույնիսկ Ամերիկայի Միացյալ Նահանգներից։ Միաժամանակ հայությունը բավականին դրամ հանգանակեց ջոկատների հանդերձավորման համար։ Սկզբնապես 1914 թ. աշնանը կազմակերպվում են կամավորական չորս ջոկատներ։ Հետագայում դրանց թիվն աճեց։ Առաջինի հրամանատարն էր Անդրանիկը, երկրորդինը՝ Դրոն, երրորդինը՝ Համազասպը, չորրորդինը՝ Քեռին։ Հինգերորդ ջոկատի հրամանատարն էր Վարդանը (Սարգիս Մեհրաբյան)։ Ավելի ուշ կազմակերպվում են ևս երեք ջոկատներ։ Վեցերորդ ջոկատի հրամանատարն էր Արշակ Ջանփոլադյանը, ապա՝ Գրիգոր Ավշարյանը, վերջինիս զոհվելուց հետո՝ Հայկ Բժշկյանը (հետագայում՝ խորհրդային ականավոր զորահրամանատար Գայ)։ Ընդհանուր առմամբ կամավորական ջոկատներում ընդգրկված էին շուրջ 10 հազար հոգի:`

        histText: `Ազգային զարթոնքը (1960-ական թթ.)

Համեմատաբար ազատության պայմաններում զարգացում ապրեցին հայ գրականությունը, արվեստը, հասարակական գիտությունները։ Մինչ այդ փաստորեն արգելված ազգային-հայրենասիրական թեմաներով բազմաթիվ արժեքավոր գրական-գեղարվեստական, պատմագիտական, մշակույթի գործեր ստեղծվեցին։

        histText: `Հայաստանի Հանրապետության կայացումը։ Արամ Մանուկյան
Արամ Մանուկյանը հայ ազգային-ազատագրական պայքարի կարևոր գործիչներից էր։ Նա ղեկավարում էր ՀՅԴ Վանի կազմակերպությունը և մեծ դեր ունեցավ Վանի ինքնապաշտպանության կազմակերպման գործում։ 1915 թ. ապրիլի 5-ին նրա նախաձեռնությամբ ստեղծվեց Զինվորական մարմինը, որը ղեկավարեց Վանի ինքնապաշտպանությունը և ապահովեց հազարավոր հայերի փրկությունը։ Մայիսի 7-ին Արամ Մանուկյանը նշանակվեց Վանի նահանգապետ և կազմակերպեց քաղաքի կառավարման աշխատանքները։ Սակայն հուլիսին, ռուսական զորքերի նահանջից հետո, Վանի հայությունը հարկադրված էր հեռանալ։
1917 թ դեկտեմբերին Արամ Մանուկյանը գործուղվեց Երևան՝ կազմակերպելու ինքնապաշտպանական և պետականաշինության աշխատանքները։ Նա մեծ ջանքեր գործադրեց հայկական կանոնավոր բանակի ստեղծման համար և պայքարեց օրինականության հաստատման ուղղությամբ։ 1918 թ. մարտի 24-ին ընտրվեց Երևանի նահանգի դիկտատոր և ղեկավարեց ռազմական ու քաղաքական գործերը։

                                                                />

                                                                    <span className="font-bold text-slate-700 block mb-1">{q.q} <span className="text-xs font-normal text-slate-400">({q.author})</span></span>
                                                                    <span className="text-slate-500 text-xs line-clamp-1">{q.options.join(', ')}</span>
                                                                </div>
                                                            </label>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-amber-700 mb-3 border-b pb-2 flex justify-between items-center mt-6">
                                                    <span>Բաց / Ամփոփիչ հարցեր</span>
                                                    <span className="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full">{selectedOpenIds.length} ընտրված</span>
                                                </h4>
                                                <div className="space-y-2">
                                                    {availableOpen.map((q, idx) => {
                                                        const uniqueId = `${q.author}-${q.id}`;
                                                        return (
                                                            <label key={uniqueId} className="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition-colors">
                                                                <input 
                                                                    type="checkbox"
                                                                    checked={selectedOpenIds.includes(uniqueId)}
                                                                    onChange={() => toggleOpenQ(uniqueId)}
                                                                    className="w-5 h-5 mt-0.5 text-amber-600 rounded border-slate-300 cursor-pointer flex-shrink-0"
                                                                />
                                                                <div className="text-sm">
                                                                    <span className="font-bold text-slate-700 block mb-1">{q.q} <span className="text-xs font-normal text-slate-400">({q.author})</span></span>
                                                                </div>
                                                            </label>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-6 flex justify-between items-center pt-4 border-t border-slate-100 shrink-0">
                                    {modalStep === 1 ? (
                                        <>
                                            <button onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm hover:bg-slate-200">
                                                Չեղարկել
                                            </button>
                                            <button onClick={handleGoToStep2} className="px-6 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm hover:bg-blue-700 shadow-sm flex items-center gap-2">
                                                Առաջ անցնել →
                                            </button>
                                        </>
                                    ) : (
                                        <>
                                            <button onClick={() => setModalStep(1)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-sm hover:bg-slate-200">
                                                ← Հետ
                                            </button>
                                            <button onClick={handleGeneratePdf} className="px-6 py-2.5 bg-green-600 text-white font-bold rounded-xl text-sm hover:bg-green-700 shadow-sm flex items-center gap-2">
                                                <span>📄</span> Ներբեռնել PDF-ը
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    {/* --- ՎԵՐՋ MODAL ՊԱՏՈՒՀԱՆԻ --- */}
            </div>
        );
    }
    return (
        <div className="max-w-4xl mx-auto px-4 py-12">
            <button onClick={() => setSelectedTest(null)} className="mb-6 text-blue-600 font-bold hover:underline flex items-center gap-2">
                ← Հետ դեպի թեստերի ցանկ
            </button>
            
            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-6 gap-4">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-800">{selectedTest.title}</h2>
                    {!results && (
                        <button 
                            onClick={downloadBlankPDF} 
                            className="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 shadow-sm transition-colors text-sm flex items-center gap-2 whitespace-nowrap"
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Դատարկ թեստ
                        </button>
                    )}
                </div>
                
                {!results ? (
                    <div className="space-y-6">
                        {/* ՓԱԿ ՀԱՐՑԵՐԻ ԲԼՈԿ */}
                        {selectedTest.closed.map(q => (
                            <div key={`c_${q.id}`} className="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                <p className="font-bold text-slate-700 mb-4">{q.id}. {q.q}</p>
                                <div className="space-y-3">
                                    {q.options.map((opt, idx) => (
                                        <label key={idx} className="flex items-start gap-3 cursor-pointer group">
                                            <input 
                                                type="radio" 
                                                name={`q_${q.id}`} 
                                                value={opt.charAt(0)}
                                                onChange={() => handleAnswerChange(`c_${q.id}`, opt.charAt(0))}
                                                className="mt-1 w-4 h-4 text-blue-600 focus:ring-blue-500"
                                            />
                                            <span className="text-slate-600 group-hover:text-slate-900 transition-colors">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                        {/* ԲԱՑ ՀԱՐՑԵՐԻ ԲԼՈԿ */}
                        {selectedTest.open.map(q => (
                            <div key={`o_${q.id}`} className="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                <p className="font-bold text-slate-700 mb-3">{q.id}. {q.q}</p>
                                <textarea 
                                    rows="6"
                                    className="w-full p-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-700 resize-none shadow-inner bg-white"
                                    placeholder="Գրեք ձեր պատասխանը այստեղ..."
                                    value={answers[`o_${q.id}`] || ''}
                                    onChange={(e) => handleAnswerChange(`o_${q.id}`, e.target.value)}
                                ></textarea>
                            </div>
                        ))}
                        <div className="pt-6 border-t border-slate-200 flex justify-end">
                            <button 
                                onClick={handleSubmit} 
                                disabled={isEvaluating}
                                className="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-sm disabled:opacity-50 transition-colors"
                            >
                                {isEvaluating ? 'Ստուգվում է...' : 'Հանձնել թեստը'}
                            </button>
                        </div>
                    </div>
                ) : (
                    <div className="space-y-8 animate-fade-in">
                        {/* ԳՆԱՀԱՏԱԿԱՆԻ ԵՎ ՆԵՐԲԵՌՆՄԱՆ ՎԱՀԱՆԱԿ */}
                        <div className="text-center bg-gradient-to-r from-blue-50 to-indigo-50 p-8 rounded-2xl border border-blue-100">
                            <h3 className="text-4xl font-black text-blue-900 mb-3">Արդյունք: {results.totalScore} / {results.maxTotal}</h3>
                            <div className="flex justify-center gap-4 text-sm font-bold text-blue-700 mb-6">
                                <span className="bg-white px-4 py-2 rounded-lg shadow-sm">Փակ հարցեր: {results.closedScore}/{results.closedTotal}</span>
                                <span className="bg-white px-4 py-2 rounded-lg shadow-sm">Բաց հարցեր (ԱԲ): {results.openScore}/{results.openTotal}</span>
                            </div>
                            <button onClick={downloadPDF} className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md transition-transform hover:scale-105 inline-flex items-center gap-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Ներբեռնել արդյունքները (PDF)
                            </button>
                        </div>
                        {/* ՍՏՈՒԳՎԱԾ ՓԱԿ ՀԱՐՑԵՐ */}
                        <div className="space-y-4">
                            {selectedTest.closed.map(q => {
                                const r = results.closedResults[q.id];
                                return (
                                    <div key={`res_c_${q.id}`} className={`p-4 rounded-xl border-l-4 ${r.isCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                        <p className="font-bold text-slate-700 mb-2">{q.id}. {q.q}</p>
                                        <div className={`font-bold flex items-center gap-2 ${r.isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                                            {r.isCorrect ? (
                                                <><span>✅</span> Ճիշտ է: {r.userAns}</>
                                            ) : (
                                                <><span>❌</span> Սխալ է: Ձեր պատասխանը՝ {r.userAns} <span className="ml-4 text-slate-500">(Ճիշտը՝ {r.correctAnsw})</span></>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        {/* ՍՏՈՒԳՎԱԾ ԲԱՑ ՀԱՐՑԵՐ ԵՎ ԱԲ ԿԱՐԾԻՔ */}
                        <div className="space-y-6 pt-4 border-t border-slate-200">
                            {selectedTest.open.map(q => (
                                <div key={`res_o_${q.id}`} className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <p className="font-bold text-slate-800 mb-3">{q.id}. {q.q}</p>
                                    <div className="bg-white p-4 rounded-lg border border-slate-200 mb-4 shadow-inner">
                                        <p className="text-slate-600 italic">«{answers[`o_${q.id}`] || 'Չի պատասխանել'}»</p>
                                    </div>
                                    <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                                        <h4 className="font-bold text-indigo-800 text-sm mb-2 flex items-center gap-2"><span>✨</span> ԱԲ Կարծիք (AI Feedback):</h4>
                                        <p className="text-sm text-indigo-900 leading-relaxed">{results.openResults[q.id.toString()] || "Կարծիք չկա:"}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                    </div>
                )}
            </div>
        </div>
    );
}
        function Footer() {
            return (
                <footer className="bg-slate-900 text-slate-300 py-10 mt-auto border-t border-slate-800">
                    <div className="max-w-7xl mx-auto px-4 text-center">
                        <p className="font-bold text-sm">© 2026 Գրական անկյուն. բոլոր իրավունքները պաշտպանված են:</p>
                        <p className="text-sm text-slate-500 mt-3">Ստեղծվել է Նարինե Ասատրյանի և Նարեկ Օհանյանի կողմից:</p>
                    </div>
                </footer>
            );
        }
        function App() {
            const [currentPage, setCurrentPage] = useState('office');
            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} ></Navbar>
                    <main className="flex-grow pt-8 pb-16">
                        {currentPage === 'office' && <VirtualOffice ></VirtualOffice>}
                        {currentPage === 'textbooks' && <Textbooks ></Textbooks>}
                        {currentPage === 'games' && <Games ></Games>}
                        {currentPage === 'authors' && <Authors ></Authors>}
                        {currentPage === 'tests' && <Tests ></Tests>}
                    </main>
                    <Footer ></Footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App ></App>);
    </script>
</body>
</html>
