<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"
     aria-labelledby="oc-t oc-d">
  <title id="oc-t">The overshoot curve</title>
  <desc id="oc-d">Global warming rises past the 1.5 degree threshold around 2035, peaks near
  1.85 degrees around 2062, then is drawn back below 1.5 by the end of the century. The shaded
  band is the overshoot period the book is named for.</desc>
